<!DOCTYPE html>
<html lang="en">
<head>
  <script data-goatcounter="https://tlcp-games.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG English</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Game Container reserves top strip so floating buttons never overlap the game */
    #game-container {
      width: 100vw;
      height: 100vh;
      padding: 56px 12px 12px 12px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fixed Exit Button */
    #back-hub-btn {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #ffffff;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      border-radius: 980px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #back-hub-btn:hover {
      transform: scale(1.04);
      background: #f1f2f6;
    }

    #back-hub-btn:active {
      transform: scale(0.96);
    }

    /* Fixed Fullscreen Toggle Button */
    #fullscreen-btn {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #ffffff;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      border-radius: 980px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #fullscreen-btn:hover {
      transform: scale(1.04);
      background: #f1f2f6;
    }

    #fullscreen-btn:active {
      transform: scale(0.96);
    }

    #audio-mute-btn {
      position: fixed;
      top: 12px;
      right: 146px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 13px;
      background: #ffffff;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      border-radius: 980px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #audio-mute-btn:hover {
      transform: scale(1.04);
      background: #f1f2f6;
    }

    #audio-mute-btn:active {
      transform: scale(0.96);
    }

    /* Certificate Modal Overlay */
    #certificate-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .cert-modal-card {
      background: #1e272e;
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 18px 24px;
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
    }

    .cert-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      width: 100%;
    }

    .cert-controls label {
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
    }

    .cert-controls input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 2px solid #00d2d3;
      background: #2f3640;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 220px;
    }

    .cert-btn {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }

    .cert-btn:hover {
      transform: scale(1.04);
      opacity: 0.95;
    }

    .cert-btn-png { background: #00b894; }
    .cert-btn-print { background: #0984e3; }
    .cert-btn-close { background: #d63031; }

    #certificate-preview-img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 6px;
      border: 2px solid #f1c40f;
      background: #ffffff;
    }

    #certificate-print-area {
      display: none;
    }

    @media print {
      @page {
        size: landscape;
        margin: 0;
      }
      body {
        background: #ffffff;
        display: block;
        height: auto;
        overflow: visible;
      }
      canvas,
      #game-container,
      #certificate-modal,
      #back-hub-btn,
      #audio-mute-btn,
      #fullscreen-btn {
        display: none !important;
      }
      #certificate-print-area {
        display: flex !important;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      #certificate-print-area img {
        max-width: 96vw;
        max-height: 94vh;
        object-fit: contain;
      }
    }
  </style>

  <!-- Load Phaser Library -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>

  <!-- Floating Exit Button -->
  <a href="../../index.html" id="back-hub-btn">
    <span>←</span>
    <span>TLCP@Games</span>
  </a>

  <!-- Floating Audio Mute Toggle Button -->
  <button id="audio-mute-btn" type="button" aria-label="Toggle Sound" title="Toggle Sound / 切換音效">🔊 Sound</button>

  <!-- Floating Fullscreen Toggle Button -->
  <button id="fullscreen-btn" type="button" aria-label="Toggle Full Screen" aria-pressed="false" title="Full Screen">
    <svg id="fs-icon-enter" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
    <svg id="fs-icon-exit" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
      <polyline points="4 14 10 14 10 20"></polyline>
      <polyline points="20 10 14 10 14 4"></polyline>
      <line x1="14" y1="10" x2="21" y2="3"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
    <span id="fs-label">Full Screen</span>
  </button>

  <!-- Phaser Game Mount Container -->
  <div id="game-container"></div>

  <!-- Certificate Modal -->
  <div id="certificate-modal">
    <div class="cert-modal-card">
      <div class="cert-controls">
        <label for="cert-student-name">Student Name / 學生姓名:</label>
        <input id="cert-student-name" type="text" value="English Adventurer" maxlength="32" />
        <button id="cert-download-png" class="cert-btn cert-btn-png">💾 Save PNG / 下載圖片</button>
        <button id="cert-print-pdf" class="cert-btn cert-btn-print">🖨️ Print / Save PDF</button>
        <button id="cert-close-btn" class="cert-btn cert-btn-close">✖ Close / 關閉</button>
      </div>
      <img id="certificate-preview-img" alt="Certificate of Completion" />
    </div>
  </div>

  <div id="certificate-print-area"></div>

  <!-- Game Engine Script -->
  <script src="game.js"></script>

  <script>
    (function () {
      const muteBtn = document.getElementById('audio-mute-btn');
      if (muteBtn) {
        muteBtn.addEventListener('click', function () {
          if (typeof sfx !== 'undefined') sfx.toggleMute();
          muteBtn.blur();
        });
      }

      const fsBtn = document.getElementById('fullscreen-btn');
      const enterIcon = document.getElementById('fs-icon-enter');
      const exitIcon = document.getElementById('fs-icon-exit');
      const fsLabel = document.getElementById('fs-label');

      function getFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      async function enterFullscreen() {
        const target = document.documentElement;
        try {
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          }
        } catch (err) {
          console.warn('Unable to enter full screen:', err);
        }
      }

      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (err) {
          console.warn('Unable to exit full screen:', err);
        }
      }

      function refreshGameScale() {
        if (window.ogGame && window.ogGame.scale) {
          setTimeout(function () {
            window.ogGame.scale.refresh();
          }, 50);
        }
      }

      function syncFullscreenUI() {
        const isFullscreen = Boolean(getFullscreenElement());
        enterIcon.style.display = isFullscreen ? 'none' : 'block';
        exitIcon.style.display = isFullscreen ? 'block' : 'none';
        fsLabel.textContent = isFullscreen ? 'Exit Full Screen' : 'Full Screen';
        fsBtn.title = isFullscreen ? 'Exit Full Screen (Esc)' : 'Full Screen';
        fsBtn.setAttribute('aria-pressed', String(isFullscreen));
        refreshGameScale();
      }

      fsBtn.addEventListener('click', function () {
        if (getFullscreenElement()) {
          exitFullscreen();
        } else {
          enterFullscreen();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && getFullscreenElement()) {
          exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', syncFullscreenUI);
      document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
      window.addEventListener('resize', refreshGameScale);
    })();
  </script>
</body>
</html>
